version: '3.9'

services:
  # ============================================
  # POSTGRESQL DATABASE
  # ============================================
  postgres:
    image: postgres:16
    container_name: imararent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imararent
      POSTGRES_USER: imararent_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-imararent_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imararent_user -d imararent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imararent_network

  # ============================================
  # REDIS (BullMQ)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: imararent_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imararent_network

  # ============================================
  # BACKEND API (NestJS)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: imararent_backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://imararent_user:${DB_PASSWORD:-imararent_password}@postgres:5432/imararent?schema=public
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      
      # Application
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@imararent.com}
      
      # SMS (Africa's Talking)
      AFRICA_TALKING_USERNAME: ${AFRICA_TALKING_USERNAME}
      AFRICA_TALKING_API_KEY: ${AFRICA_TALKING_API_KEY}
      AFRICA_TALKING_SENDER_ID: ${AFRICA_TALKING_SENDER_ID:-ImaraRent}
      
      # M-Pesa
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      
      # Cloudinary (File Storage)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      
      # Sentry (Error Tracking)
      SENTRY_DSN: ${SENTRY_DSN}
      
      # Rate Limiting
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 20
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - imararent_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health/readiness', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # FRONTEND (React + Vite)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api/v1}
    container_name: imararent_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - imararent_network

  # ============================================
  # NGINX (Reverse Proxy - Optional)
  # ============================================
  # Uncomment for production with custom domain
  # nginx:
  #   image: nginx:alpine
  #   container_name: imararent_nginx
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - imararent_network

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  imararent_network:
    driver: bridge