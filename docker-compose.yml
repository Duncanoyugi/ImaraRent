version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_management
      POSTGRES_USER: rental_user
      POSTGRES_PASSWORD: rental_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rental_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data: