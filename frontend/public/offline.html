<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline — ImaraRent</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #f8fafc; color: #0f172a; padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } }
      .card { max-width: 24rem; text-align: center; }
      .badge {
        width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; border-radius: 1rem;
        display: grid; place-items: center; background: #d1fae5; color: #059669; font-size: 1.5rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; font-size: .875rem; line-height: 1.6; opacity: .75; }
      button {
        border: 0; border-radius: .625rem; padding: .625rem 1.25rem; cursor: pointer;
        background: #059669; color: #fff; font: inherit; font-size: .875rem; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">⚡</div>
      <h1>You are offline</h1>
      <p>
        ImaraRent needs a connection to load your properties, invoices and payments.
        Anything you saved while offline will sync once you reconnect.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
